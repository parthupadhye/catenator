state.topic-refraction:
  macro:
    systemName: "state.topic-refraction"
    domain: "content governance"
    intent: "Hold the topic, sources, personas, and refracted outputs across steps."
    mustNever:
      - "Lose or overwrite author-entered data between steps"
      - "Persist data beyond the current session unless explicitly extended later"
  meso:
    personas:
      - id: author
        doing: "Populates and revises state through Steps 1-3"
    fields:
      topicText: string
      sources: "list of {title, reference, description}"
      personas: "list of {id, name, summary, dimensions[]} — max 2"
      refractedOutputs: "map keyed by personaId -> text"
    persistenceScope: "in-memory / current session only — no persistence across page refresh or browser close in this phase"
  micro:
    - id: initializes-from-default-fixture
      rule: >
        On first load, Steps 1-3's fields are pre-populated from
        build-config.yaml's defaultFixture (topicText, sources,
        personas), not left empty. This is a starting value, not a
        locked one — the author can edit or fully replace any of it
        exactly as if they'd typed it themselves. Nothing about
        mandatory/validation behavior differs between fixture-sourced
        and author-typed content.
    - id: persona-id-is-positional
      rule: >
        Each persona's id is assigned by authoring order, not derived
        from its name: the first persona authored is "persona-0", the
        second (if any) is "persona-1". This id is assigned once, at
        the moment the persona is added, and never changes even if
        the persona's name or summary is later edited. This is the
        only id-derivation rule in the spec; byok-compiler.contract,
        delivery.request-response, and refractedOutputs above all key
        by this same positional id.
    - id: refracted-output-map
      rule: "Keyed by personaId — one entry per persona, never merged"