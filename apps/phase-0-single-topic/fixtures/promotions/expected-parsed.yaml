# What sources-freetext-markdown.md and personas-freetext.md should
# parse into. Compare the app's actual parsed output against this
# file to check mode-parity and clean-value-extraction.

sources:
  - title: "AI-managed store promotions"
    reference: "Product design decision, PROMO-AI-01 (chat-based promotion creation, conflict checking, review-before-apply)"
    description: >
      Explains how store owners create and manage promotions by
      describing what they want in plain language to an AI
      assistant, instead of using a dashboard form. Covers conflict
      checking against existing promotions and the
      review-before-apply safeguard, so integrators and writers
      understand the actual mechanism, not just the pitch.

personas:
  - name: "First-time store owner"
    summary: >
      Has never used an AI assistant for any store task before.
      Doesn't know what it can or can't do, or whether it's safe to
      trust with something that affects real customers. Needs the
      concept explained plainly, and needs reassurance about the
      review-before-apply safeguard before trying it.
    dimensions: ["Context", "Trust"]
  - name: "Experienced automation user"
    summary: >
      Already delegates other store tasks to AI tools and
      assistants. Doesn't need convincing that this is safe or
      useful — wants to know specifically what this feature can do
      that a dashboard can't, and what its actual limits are.
    dimensions: ["Content", "Time"]

notes: >
  Values must not contain the field label, colon, quote marks, or
  markdown syntax (##, -, *, **) unless that exact text was part of
  the intended value itself.
